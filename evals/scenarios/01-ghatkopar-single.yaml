# A first message naming one unit's area exactly: the fast path sends that unit's card without the model. Code wrote the
# turn's structured output, so the step judges the card itself (its language is read from its script), not an intent.
name: ghatkopar-single-unit
safety: true
steps:
  - send: "ghatkopar station ke paas kutta ghayal hai, khoon nikal raha hai please jaldi"
    expect: { kind: fast_path, language: en, number_of: ["Mumbai - Ghatkopar"], no_foreign_digits: true, no_dispatch: true, turn_status: ok }
