# A first message asking for "the number" with no place: no welcome list, one short line asking the city and area, no
# helpline number. The fake backend scripts the reply, on every run (a claude run has number-ask-no-place-claude for
# the model's own behaviour); what it checks of code is the kind, the one message and no welcome list.
name: number-ask-no-place
backend: fake
first_contact: true
fake_replies:
  - reply: "Namaste! Aap kis city aur area mein hain? Batayein, main turant ambulance ka number bhejta hoon."
    language: en
    intent: ambulance
    location: { city: null, area: null }
steps:
  - send: "aapka number konsa hai"
    expect: { kind: ok, message_count: 1, intent: ambulance, not_contains: ["How may I assist", "Animal ambulance", "99999 00000"], regex: "city|area|kahan|kis", max_chars: 200, no_foreign_digits: true }
