# The model's own answer to "where is the hospital?": find_clinics, then a clinic reply with the Ghatkopar hospital's
# number, its hours (the fixture publishes 10am–11pm IST, so the hours themselves, never only a "call" line, which the
# number line would satisfy anyway), its Google Maps link and its address: the order the prompt's hospitals rule asks
# for, which the step does not check. The link is the fixture's, which the model never sees: it reaches the reply only
# through the {{MAPS:…}} token find_clinics returned. Needs the real model.
name: hospital-location-claude
backend: claude
steps:
  - send: "ghatkopar hospital kahan hai?"
    expect:
      kind: ok
      intent: clinic
      number_of: ["Mumbai - Ghatkopar Hospital"]
      contains: ["https://maps.google.com/?q=19.07948,72.90119", "Rajawadi"]
      regex: "\\d{1,2}\\s*(am|pm)|\\bIST\\b"
      no_foreign_digits: true
      no_dispatch: true
