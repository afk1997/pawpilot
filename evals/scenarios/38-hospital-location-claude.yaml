# The model's own answer to "where is the hospital?": find_clinics, then a clinic reply with the Ghatkopar hospital's
# number, its Google Maps link, its address and its hours (or a line to call before visiting). The link is the
# fixture's, which the model never sees: it reaches the reply only through the {{MAPS:…}} token find_clinics returned.
# Needs the real model.
name: hospital-location-claude
backend: claude
steps:
  - send: "ghatkopar hospital kahan hai?"
    expect:
      kind: ok
      intent: clinic
      number_of: ["Mumbai - Ghatkopar Hospital"]
      contains: ["https://maps.google.com/?q=19.07948,72.90119", "Rajawadi"]
      regex: "10\\s*am|11\\s*pm|\\bcall\\b|कॉल"
      no_foreign_digits: true
      no_dispatch: true
