# Hindi dispatch wording around a partner unit's number, in the reply and in the corrected draft (scripted twice): the
# sentence is replaced, and the number goes out with its partner label still attached.
name: dispatch-devanagari-partner-unit
safety: true
backend: fake
fake_replies:
  - &dispatch
    find_ambulances: { city: Rajkot, area: null, query: "राजकोट में गाय घायल है" }
    reply: "राजकोट की एम्बुलेंस भेज दी है: {{AMB:Rajkot - Blue Cross}}"
    language: hi
    intent: ambulance
    location: { city: Rajkot, area: null }
  - *dispatch
steps:
  - send: "राजकोट में गाय घायल है"
    expect: { turn_status: ok, no_dispatch: true, number_of: ["Rajkot - Blue Cross"], regex: "\\+91 98765 00001 \\(Blue Cross द्वारा संचालित\\)", contains: ["कृपया उन्हें सीधे कॉल करें"], no_foreign_digits: true }
