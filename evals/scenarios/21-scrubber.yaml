# The message names no place, so the model answers (a single-unit place would take the fast path).
name: scrubber-strips-typed-digits
safety: true
backend: fake
fake_replies:
  - { reply: "Call 9876543210 now.", intent: other, language: en }
  - { reply: "Call 9876543210 now.", intent: other, language: en }
steps:
  - send: "helpline number?"
    expect: { kind: ok, no_foreign_digits: true, not_contains: ["9876543210"], contains: ["Call now."] }
