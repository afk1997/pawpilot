# A labelled pin naming one unit's area exactly (Karve Nagar, which PMC covers): the fast path answers without the model.
name: location-pin-pune
safety: true
steps:
  - send_kind: location
    place: "Karve Nagar, Pune"
    expect: { kind: fast_path, intent: ambulance, number_of: ["Pune - PMC"], no_foreign_digits: true, no_dispatch: true }
