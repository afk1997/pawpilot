name: human-request-flags
fake_replies:
  - get_info: { topic: helpline }
    reply: "Of course. Please call our helpline and a person from our team will help you: {{PHONE:helpline}}"
    language: en
    intent: other
    needs_human: true
  - find_ambulances: { city: Surat, area: null, query: "surat, injured dog" }
    reply: "Please call the Surat animal ambulance right away: {{AMB:Surat}}."
    language: en
    intent: ambulance
    location: { city: Surat, area: null }
steps:
  - send: "I want to talk to a human person please"
    expect: { contains: ["+91 99999 00000"], flagged: true, no_foreign_digits: true }
  - send: "surat, injured dog"
    expect: { number_of: ["Surat"], no_foreign_digits: true }
