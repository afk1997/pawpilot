# The model's own answer to a request for a hospital's number: find_clinics, the Ghatkopar hospital's number (the words
# pre-match also offers the Ghatkopar ambulance, which is not what was asked), and the word hospital. Needs the real
# model.
name: hospital-ghatkopar-claude
backend: claude
steps:
  - send: "ghatkopar hospital ka number"
    expect: { kind: ok, number_of: ["Mumbai - Ghatkopar Hospital"], regex: "hospital|हॉस्पिटल", no_foreign_digits: true, no_dispatch: true }
