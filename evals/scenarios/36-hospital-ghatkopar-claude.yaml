# The model's own answer to a request for a hospital's number: find_clinics, the Ghatkopar hospital's number, and the
# word hospital. "hospital" keeps the Ghatkopar ambulance out of the pre-match (skipped: other_intent), so nothing
# offers the model the ambulance instead. Needs the real model.
name: hospital-ghatkopar-claude
backend: claude
steps:
  - send: "ghatkopar hospital ka number"
    expect: { kind: ok, number_of: ["Mumbai - Ghatkopar Hospital"], regex: "hospital|हॉस्पिटल", no_foreign_digits: true, no_dispatch: true }
