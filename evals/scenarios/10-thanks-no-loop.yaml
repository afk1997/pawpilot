name: thanks-no-loop
fake_replies:
  - find_ambulances: { city: Surat, area: null, query: "surat" }
    reply: "Please call the Surat animal ambulance right away: {{AMB:Surat}}."
    language: en
    intent: ambulance
    location: { city: Surat, area: null }
  - reply: "You're welcome. I hope the animal gets help soon."
    language: en
    intent: smalltalk
    location: { city: Surat, area: null }
  - reply: "Thank you for helping the animal. Take care!"
    language: en
    intent: smalltalk
    location: { city: Surat, area: null }
steps:
  - send: "surat"
    expect: { number_of: ["Surat"] }
  - send: "ok"
    expect: { message_count: 1, not_contains: ["Animal ambulance", "Clinic info"], no_foreign_digits: true }
  - send: "thanks 🙏"
    expect: { message_count: 1, not_contains: ["Animal ambulance", "Clinic info"], no_foreign_digits: true }
